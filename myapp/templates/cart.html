<h1>Ваша корзина</h1>

{% if cart_items %}
    <table>
        <tr>
            <th>Товар</th>
            <th>Цена</th>
            <th>Количество</th>
            <th>Сумма</th>
            <th>Действия</th>
        </tr>
        {% for item in cart_items %}
        <tr>
            <td>{{ item.product.name }}</td>
            <td>{{ item.product.price }} руб.</td>
            <td>
                <form method="post" action="{% url 'cart_update' item.product.id|add:'-34' %}">
                    {% csrf_token %}
                    <input type="number" name="quantity" value="{{ item.quantity }}" min="1" max="{{ item.product.stock }}">
                    <button type="submit">Обновить</button>
                </form>
            </td>
            <td>{{ item.total }} руб.</td>
            <td>
                <a href="{% url 'cart_remove' item.product.id|add:'-34' %}">Удалить</a>
            </td>
        </tr>
        {% endfor %}
    </table>

    <p>Общая стоимость: {{ total_price }} руб.</p>
{% else %}
    <p>Корзина пуста</p>
{% endif %}
